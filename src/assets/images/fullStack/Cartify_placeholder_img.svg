<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Cartify placeholder image">
  <title>Cartify placeholder image</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="55%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <circle cx="260" cy="200" r="520" fill="url(#glowA)" />
  <circle cx="1380" cy="740" r="480" fill="url(#glowB)" />

  <!-- Decorative nodes -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.9">
    <line x1="1180" y1="700" x2="1300" y2="640" />
    <line x1="1300" y1="640" x2="1420" y2="710" />
    <line x1="1180" y1="700" x2="1300" y2="790" />
  </g>
  <g fill="#38bdf8">
    <circle cx="1180" cy="700" r="6" opacity="0.7" />
    <circle cx="1300" cy="640" r="9" opacity="0.5" />
    <circle cx="1420" cy="710" r="6" opacity="0.7" />
    <circle cx="1300" cy="790" r="6" opacity="0.35" />
  </g>

  <!-- API window -->
  <g>
    <rect x="140" y="230" width="620" height="440" rx="18" fill="#0b1220" stroke="#1e293b" stroke-width="2" />
    <rect x="140" y="230" width="620" height="54" rx="18" fill="#0f172a" />
    <rect x="140" y="266" width="620" height="18" fill="#0f172a" />
    <line x1="140" y1="284" x2="760" y2="284" stroke="#1e293b" stroke-width="2" />

    <circle cx="174" cy="257" r="6" fill="#334155" />
    <circle cx="196" cy="257" r="6" fill="#334155" />
    <circle cx="218" cy="257" r="6" fill="#334155" />

    <rect x="252" y="243" width="192" height="28" rx="14" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
    <text x="348" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7dd3fc">POST /api/v1</text>

    <rect x="622" y="243" width="118" height="28" rx="14" fill="#020617" stroke="#14532d" stroke-width="1.5" />
    <text x="681" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#4ade80">200 OK</text>

    <!-- Code lines -->
    <rect x="172" y="320" width="88" height="12" rx="6" fill="#38bdf8" opacity="0.9" />
    <rect x="270" y="320" width="196" height="12" rx="6" fill="#1e293b" />
    <rect x="476" y="320" width="92" height="12" rx="6" fill="#334155" />

    <rect x="196" y="350" width="142" height="12" rx="6" fill="#1e293b" />
    <rect x="348" y="350" width="228" height="12" rx="6" fill="#334155" />

    <rect x="196" y="380" width="204" height="12" rx="6" fill="#334155" />
    <rect x="410" y="380" width="122" height="12" rx="6" fill="#38bdf8" opacity="0.65" />

    <rect x="196" y="410" width="258" height="12" rx="6" fill="#1e293b" />

    <rect x="172" y="440" width="70" height="12" rx="6" fill="#38bdf8" opacity="0.5" />
    <rect x="252" y="440" width="168" height="12" rx="6" fill="#1e293b" />

    <rect x="172" y="470" width="112" height="12" rx="6" fill="#334155" />
    <rect x="172" y="530" width="150" height="12" rx="6" fill="#1e293b" />
    <rect x="332" y="530" width="104" height="12" rx="6" fill="#334155" />

    <line x1="140" y1="500" x2="760" y2="500" stroke="#1e293b" stroke-width="2" opacity="0.6" />

    <rect x="172" y="600" width="104" height="12" rx="6" fill="#334155" />
    <rect x="286" y="600" width="180" height="12" rx="6" fill="#1e293b" />
    <rect x="476" y="600" width="76" height="12" rx="6" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- Feature chips -->
  <g>
    <rect x="140" y="694" width="188" height="46" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5" />
    <text x="234" y="722" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#94a3b8">Auth / JWT</text>

    <rect x="344" y="694" width="188" height="46" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5" />
    <text x="438" y="722" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#94a3b8">Image Uploads</text>

    <rect x="548" y="694" width="212" height="46" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5" />
    <text x="654" y="722" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#94a3b8">REST API / MongoDB</text>
  </g>

  <!-- Text column -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="830" y="322" font-size="88" font-weight="700" fill="#f8fafc" letter-spacing="-2">Cartify</text>
    <text x="830" y="372" font-size="30" font-weight="500" fill="#94a3b8">E-commerce Backend API</text>
    <rect x="830" y="402" width="96" height="4" fill="#38bdf8" />
    <text x="830" y="456" font-size="22" fill="#7dd3fc">Backend development in progress</text>

    <rect x="830" y="500" width="268" height="42" rx="21" fill="#020617" stroke="#334155" stroke-width="1.5" />
    <text x="964" y="527" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="2.5" fill="#64748b">PLACEHOLDER IMAGE</text>
  </g>
</svg>
